<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}KINETIC PULSE | Game{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .font-space { font-family: 'Space Grotesk', sans-serif; }

        .glass {
            backdrop-filter: blur(24px);
            background: rgba(35, 38, 44, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #81ecff, #d277ff);
            color: #1a1a2e;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(129, 236, 255, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* Gesture Overlay */
        #gestureOverlay {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-slate-950">

    <!-- Top Navigation -->
    <header class="w-full sticky top-0 z-50 bg-black/40 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-8">
            <a href="/home" class="text-2xl font-bold tracking-tighter text-cyan-400 uppercase font-space">KINETIC_PULSE</a>
            <nav class="hidden md:flex gap-6">
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/dashboard">Dashboard</a>
                <a class="text-cyan-400 font-space tracking-widest text-xs uppercase" href="/games">Games Hub</a>
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/profile">Profile</a>
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/air_canvas">Air Canvas</a>
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/presentation">Presentation</a>
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/mediaplayer">Media Player</a>
                <a class="text-slate-400 hover:text-cyan-300 transition-colors uppercase text-xs tracking-widest font-space" href="/smarthome">Smart Home</a>
            </nav>
        </div>
        <div class="flex items-center gap-5">
            <div id="userInfo" class="flex items-center gap-3 px-3 py-1.5 bg-white/5 rounded-full border border-white/10">
                <span class="material-symbols-outlined text-cyan-400 text-sm">person</span>
                <span id="userName" class="text-xs text-cyan-400 font-space tracking-wider lowercase">loading...</span>
            </div>
            <button id="logoutBtn" class="text-slate-500 hover:text-cyan-400 text-xs uppercase tracking-widest font-space transition-colors">Logout</button>
        </div>
    </header>

    <!-- Main Game Content -->
    <main class="animate-fade-in">
        {% block content %}{% endblock %}
    </main>

    <!-- Gesture HUD -->
    <div id="gestureOverlay" class="glass border border-white/10 rounded-2xl p-4 flex flex-col items-center gap-2 opacity-40 hover:opacity-100 min-w-[100px]">
        <div id="neuralStatus" class="absolute -top-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-slate-950"></div>
        <div id="gestureIcon" class="text-3xl">✋</div>
        <div id="gestureText" class="text-[10px] uppercase font-space tracking-[0.2em] text-cyan-400">Waiting...</div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        // User Info
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const u = JSON.parse(userStr);
                document.getElementById('userName').textContent = u.username || 'user';
            } catch(e) {}
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        // Auto-Launch game client when opening a game
        window.addEventListener('DOMContentLoaded', () => {
            const gameId = "{{ game_id | default('final_gesture_client_fixed') }}";
            if (gameId) {
                fetch(`/api/system/start-client/${gameId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                }).catch(err => console.log('Failed to auto-launch client:', err));
            }
        });
        
        // Auto-Kill game client when navigating away or closing tab
        window.addEventListener('beforeunload', () => {
            const gameId = "{{ game_id | default('final_gesture_client_fixed') }}";
            if (gameId) {
                navigator.sendBeacon(`/api/system/stop-client/${gameId}`);
            }
        });

        // Global Gesture Logic
        const gestureIcon = document.getElementById('gestureIcon');
        const gestureText = document.getElementById('gestureText');
        const gestureHUD = document.getElementById('gestureOverlay');

        function updateGestureHUD(gesture) {
            const icons = {
                'PINCH': '🤏', 'OPEN_PALM': '✋', 'FIST': '✊', 
                'POINT': '👆', 'PEACE': '✌️', 'LEFT_CLICK': '🖱️',
                'RIGHT_CLICK': '🖱️', 'SCROLL': '↕️'
            };
            gestureIcon.textContent = icons[gesture] || '🤚';
            gestureText.textContent = gesture;
            gestureHUD.classList.remove('opacity-40');
            gestureHUD.classList.add('scale-110', 'border-cyan-500/50');
            setTimeout(() => {
                gestureHUD.classList.add('opacity-40');
                gestureHUD.classList.remove('scale-110', 'border-cyan-500/50');
            }, 500);
        }

        // WebSocket for gestures
        const socket = io('/', { query: { token }, transports: ['websocket', 'polling'] });
        socket.on('gesture_activity', (data) => {
            const gesture = (data.gesture || '').toUpperCase();
            if (gesture) {
                updateGestureHUD(gesture);
                if (window.handleGesture) window.handleGesture(gesture);
            }
        });

        socket.on('connect', () => {
            gestureText.textContent = 'Connected';
            gestureHUD.classList.add('border-green-500/30');
            document.getElementById('neuralStatus').className = 'absolute -top-1 -right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-slate-950 animate-pulse';
        });

        socket.on('disconnect', () => {
            gestureText.textContent = 'Disconnected';
            gestureHUD.classList.add('border-red-500/30');
            document.getElementById('neuralStatus').className = 'absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-slate-950';
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>

</html>
