<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Register | KINETIC PULSE</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#81ecff",
                        "secondary": "#d277ff",
                        "background": "#0c0e12",
                        "surface": "#171a1f",
                        "surface-variant": "#23262c",
                        "on-surface": "#f6f6fc",
                        "on-surface-variant": "#aaabb0",
                        "outline": "#46484d",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.body');
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(129, 236, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(210, 119, 255, 0.05) 0%, transparent 50%);
        }

        .glass-card {
            background: rgba(23, 26, 31, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(129, 236, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .neo-glow {
            box-shadow: 0 0 40px rgba(129, 236, 255, 0.1);
        }

        .animated-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
            animation: pulse-orb 20s infinite alternate ease-in-out;
        }

        @keyframes pulse-orb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(-5%, -5%); }
        }

        .input-dark {
            @apply w-full bg-white/[0.03] border border-white/10 rounded-xl px-4 py-2.5 text-on-surface focus:border-primary/50 focus:bg-white/[0.05] transition-all outline-none placeholder:text-on-surface-variant/30 text-sm;
        }

        .strength-bar {
            height: 4px;
            @apply rounded-full bg-white/5 overflow-hidden mt-2;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            @apply transition-all duration-500 ease-out;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Background Orbs -->
    <div class="animated-bg-orb w-[600px] h-[600px] bg-secondary top-[-10%] right-[-10%]"></div>
    <div class="animated-bg-orb w-[500px] h-[500px] bg-primary bottom-[-10%] left-[-10%]" style="animation-delay: -7s;"></div>

    <div class="w-full max-w-[480px] relative">
        <!-- Brand Header (Mini) -->
        <div class="text-center mb-6">
            <h1 class="font-headline text-2xl font-bold tracking-tighter text-on-surface uppercase inline-flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">app_registration</span>
                Join <span class="text-primary font-light">Pulse</span>
            </h1>
        </div>

        <!-- Auth Card -->
        <div class="glass-card p-8 sm:p-10 rounded-[2.5rem] neo-glow">
            <h2 class="text-lg font-headline font-bold text-on-surface mb-6 text-center uppercase tracking-widest">Create Profile</h2>
            
            <form id="registerForm" class="space-y-4">
                <!-- Username -->
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Username</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">person</span>
                        <input type="text" id="username" required class="input-dark pl-11" placeholder="motion_expert">
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Email</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">mail</span>
                        <input type="email" id="email" required class="input-dark pl-11" placeholder="user@pulse.io">
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">key</span>
                        <input type="password" id="password" required class="input-dark pl-11" placeholder="••••••••">
                    </div>
                    <div class="strength-bar">
                        <div id="strengthFill" class="strength-fill"></div>
                    </div>
                    <p id="strengthText" class="text-[8px] text-right text-on-surface-variant/40 uppercase font-bold tracking-widest mt-1">Weak</p>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1.5">
                    <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Confirm Identity</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-lg">verified_user</span>
                        <input type="password" id="confirmPassword" required class="input-dark pl-11" placeholder="••••••••">
                    </div>
                </div>

                <!-- Messages -->
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] font-medium py-2.5 px-4 rounded-xl text-center"></div>
                <div id="successMessage" class="hidden bg-primary/10 border border-primary/20 text-primary text-[10px] font-medium py-2.5 px-4 rounded-xl text-center"></div>

                <button type="submit" id="registerBtn" class="w-full bg-primary text-background font-headline font-bold uppercase tracking-widest py-3.5 rounded-xl hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(129,236,255,0.2)] mt-4">
                    <span id="btnLabel">Join the System</span>
                    <span class="material-symbols-outlined text-xl">rocket_launch</span>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/5 text-center">
                <p class="text-on-surface-variant text-xs mb-1">Already recognized?</p>
                <a href="/login" class="text-primary font-bold text-sm hover:underline">Return to Login</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const registerBtn = document.getElementById('registerBtn');
        const btnLabel = document.getElementById('btnLabel');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        function showMessage(type, msg) {
            const div = type === 'error' ? errorDiv : successDiv;
            const other = type === 'error' ? successDiv : errorDiv;
            other.classList.add('hidden');
            div.textContent = msg;
            div.classList.remove('hidden');
            if (type === 'error') {
                 setTimeout(() => div.classList.add('hidden'), 5000);
            }
        }

        // Password Strength
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;
            if (val.length >= 6) score += 25;
            if (val.length >= 10) score += 25;
            if (/[A-Z]/.test(val)) score += 25;
            if (/[0-9]/.test(val)) score += 25;

            strengthFill.style.width = score + '%';
            if (score <= 25) {
                strengthFill.style.backgroundColor = '#ef4444';
                strengthText.textContent = 'WEAK';
            } else if (score <= 50) {
                strengthFill.style.backgroundColor = '#fb923c';
                strengthText.textContent = 'FAIR';
            } else if (score <= 75) {
                strengthFill.style.backgroundColor = '#81ecff';
                strengthText.textContent = 'STRONG';
            } else {
                strengthFill.style.backgroundColor = '#22c55e';
                strengthText.textContent = 'SECURE';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (passwordInput.value !== confirmInput.value) {
                showMessage('error', 'Authentication keys do not match.');
                return;
            }

            const username = usernameInput.value;
            const email = emailInput.value;
            const password = passwordInput.value;

            registerBtn.disabled = true;
            btnLabel.textContent = "Syncing Profile...";

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('success', 'Profile Synced! Transferring to login...');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    showMessage('error', data.error || 'System error during sync.');
                    registerBtn.disabled = false;
                    btnLabel.textContent = "Join the System";
                }
            } catch (err) {
                showMessage('error', 'Lost bridge connection to server.');
                registerBtn.disabled = false;
                btnLabel.textContent = "Join the System";
            }
        });
    </script>
</body>

</html>
