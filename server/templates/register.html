<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KINETIC_OS // ENROLLMENT</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#46484d",
                        "inverse-primary": "#006976",
                        "surface": "#0c0e12",
                        "on-secondary-fixed-variant": "#800ab4",
                        "tertiary-fixed": "#64fd7d",
                        "on-tertiary": "#006723",
                        "inverse-surface": "#f9f9ff",
                        "primary": "#81ecff",
                        "surface-container-highest": "#23262c",
                        "error-container": "#9f0519",
                        "secondary-fixed-dim": "#e7afff",
                        "primary-fixed-dim": "#00d4ec",
                        "on-secondary": "#380052",
                        "secondary-fixed": "#eec2ff",
                        "inverse-on-surface": "#53555a",
                        "surface-container": "#171a1f",
                        "surface-tint": "#81ecff",
                        "on-error": "#490006",
                        "primary-fixed": "#00e3fd",
                        "secondary-container": "#7d01b1",
                        "error-dim": "#d7383b",
                        "on-tertiary-container": "#005d1f",
                        "background": "#0c0e12",
                        "tertiary-fixed-dim": "#54ee70",
                        "on-secondary-container": "#f3cfff",
                        "primary-dim": "#00d4ec",
                        "tertiary": "#b9ffb8",
                        "primary-container": "#00e3fd",
                        "on-error-container": "#ffa8a3",
                        "on-surface": "#f6f6fc",
                        "tertiary-container": "#64fd7d",
                        "surface-container-high": "#1d2025",
                        "surface-variant": "#23262c",
                        "on-tertiary-fixed": "#004816",
                        "on-primary-fixed-variant": "#005762",
                        "surface-container-low": "#111318",
                        "on-background": "#f6f6fc",
                        "error": "#ff716c",
                        "surface-bright": "#292c33",
                        "secondary": "#d277ff",
                        "on-primary-fixed": "#003840",
                        "surface-container-lowest": "#000000",
                        "on-primary": "#005762",
                        "secondary-dim": "#d277ff",
                        "on-tertiary-fixed-variant": "#006823",
                        "tertiary-dim": "#54ee70",
                        "on-secondary-fixed": "#56007c",
                        "surface-dim": "#0c0e12",
                        "outline": "#74757a",
                        "on-surface-variant": "#aaabb0",
                        "on-primary-container": "#004d57"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Space Grotesk"],
                        body: ["Inter"],

                        mono: ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #050505;
            overflow-x: hidden;
        }

        .kinetic-grid {
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .kinetic-orb {
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(12, 14, 18, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(129, 236, 255, 0.1);
            position: relative;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, rgba(129, 236, 255, 0.2) 0%, transparent 40%, transparent 60%, rgba(210, 119, 255, 0.2) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes shakeCard {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .shake-animation {
            animation: shakeCard 0.3s ease;
        }

        .spinner-sm {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 600000s 0s, color 600000s 0s;
        }

        .strength-fill {
            transition: width 0.3s ease;
        }
    </style>
</head>

<body class="font-body text-on-surface min-h-screen flex items-center justify-center relative">

    <!-- Background Elements -->
    <div class="fixed inset-0 kinetic-grid z-0"></div>
    <div class="fixed top-1/4 -left-20 w-96 h-96 rounded-full bg-primary kinetic-orb z-0"></div>
    <div class="fixed bottom-1/4 -right-20 w-[500px] h-[500px] rounded-full bg-secondary kinetic-orb z-0"></div>
    <div
        class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-surface-tint kinetic-orb opacity-[0.05] z-0">
    </div>

    <!-- Main Content Shell -->
    <main class="relative z-10 w-full max-w-md px-6">
        <!-- Authentication Card -->
        <div class="glass-card p-10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <!-- Header Section -->
            <header class="mb-8 text-center">
                <h1 class="font-headline text-3xl font-bold tracking-tighter text-primary uppercase mb-2">
                    KINETIC_OS
                </h1>
                <div class="flex items-center justify-center gap-2 mb-3">
                    <span class="material-symbols-outlined text-[10px] text-primary">how_to_reg</span>
                    <p class="font-mono text-[10px] tracking-widest text-on-surface-variant uppercase">
                        ENROLLMENT_PROTOCOL
                    </p>
                </div>
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/20">
                    <span class="material-symbols-outlined text-primary text-sm">gesture</span>
                    <span class="font-mono text-[9px] text-primary uppercase tracking-wider">hands-free future</span>
                </div>
            </header>

            <!-- Form Fields -->
            <form id="registerForm" class="space-y-6">
                <!-- Username -->
                <div class="relative group">
                    <label
                        class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase mb-2 ml-1">
                        <i class="fas fa-user-astronaut mr-1"></i> USERNAME
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                            <i class="fas fa-fingerprint text-sm"></i>
                        </span>
                        <input id="username" name="username"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 pl-10 pr-4 transition-all duration-300"
                            placeholder="GESTURE_MASTER" type="text" autocomplete="username" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                </div>

                <!-- Email -->
                <div class="relative group">
                    <label
                        class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase mb-2 ml-1">
                        <i class="fas fa-envelope mr-1"></i> EMAIL
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                            <i class="fas fa-at text-sm"></i>
                        </span>
                        <input id="email" name="email"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 pl-10 pr-4 transition-all duration-300"
                            placeholder="OPERATOR@KINETIC.SYS" type="email" autocomplete="email" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="relative group">
                    <label
                        class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase mb-2 ml-1">
                        <i class="fas fa-key mr-1"></i> PASSWORD
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                            <i class="fas fa-hand-back-fist text-sm"></i>
                        </span>
                        <input id="password" name="password"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 pl-10 pr-4 transition-all duration-300"
                            placeholder="••••••••" type="password" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                    <!-- Strength Meter -->
                    <div class="mt-2">
                        <div class="h-1 bg-surface-container-high rounded-full overflow-hidden">
                            <div class="strength-fill h-full bg-gradient-to-r from-error via-primary to-tertiary rounded-full"
                                style="width: 0%"></div>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="font-mono text-[9px] text-on-surface-variant"
                                id="strengthLabel">PASSWORD_STRENGTH</span>
                            <span class="font-mono text-[9px] text-on-surface-variant" id="strengthText">—</span>
                        </div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="relative group">
                    <label
                        class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase mb-2 ml-1">
                        <i class="fas fa-check-circle mr-1"></i> CONFIRM_PHRASE
                    </label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">
                            <i class="fas fa-hand-peace text-sm"></i>
                        </span>
                        <input id="confirmPassword" name="confirmPassword"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 pl-10 pr-4 transition-all duration-300"
                            placeholder="••••••••" type="password" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden bg-error/10 border-l-4 border-error rounded-lg p-3 text-xs text-error-light font-mono">
                    <i class="fas fa-exclamation-triangle mr-2"></i> <span id="errorText"></span>
                </div>

                <!-- Success Message -->
                <div id="successMessage"
                    class="hidden bg-tertiary/10 border-l-4 border-tertiary rounded-lg p-3 text-xs text-tertiary font-mono">
                    <i class="fas fa-hand-peace mr-2"></i> <span id="successText"></span>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" id="registerBtn"
                        class="w-full py-5 px-6 font-headline font-bold text-on-primary bg-primary-container/20 border border-primary/40 hover:bg-primary hover:text-on-primary transition-all duration-300 active:scale-95 shadow-[0_0_15px_rgba(0,227,253,0.1)] hover:shadow-[0_0_30px_rgba(0,227,253,0.3)] tracking-widest">
                        <span id="btnLabel">INITIALIZE_ENROLLMENT →</span>
                    </button>
                </div>
            </form>

            <!-- Gesture Decorations -->
            <div class="flex justify-center gap-4 mt-6 pt-4 border-t border-white/10">
                <div class="flex items-center gap-2 text-on-surface-variant text-[10px]">
                    <i class="fas fa-hand-peace"></i>
                    <span>SWIPE_NAV</span>
                </div>
                <div class="flex items-center gap-2 text-on-surface-variant text-[10px]">
                    <i class="fas fa-hand-spock"></i>
                    <span>OPEN_PALM</span>
                </div>
                <div class="flex items-center gap-2 text-on-surface-variant text-[10px]">
                    <i class="fas fa-hand-peace fa-flip-horizontal"></i>
                    <span>SELECT</span>
                </div>
            </div>

            <!-- Footer Links -->
            <footer class="mt-6 text-center">
                <p class="font-mono text-[10px] text-on-surface-variant">
                    EXISTING_PILOT? <a href="/login"
                        class="text-primary hover:text-primary-dim transition-colors border-b border-primary/30">SIGN_IN
                        →</a>
                </p>
            </footer>
        </div>

        <!-- System Metadata Decorations -->
        <div class="mt-8 flex justify-between items-center px-2 opacity-40">
            <div class="flex items-center gap-2 font-mono text-[8px] tracking-[0.2em]">
                <span class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse"></span>
                CORE_STABLE_V4.2
            </div>
            <div class="font-mono text-[8px] tracking-[0.2em]">
                ENCRYPTION: AES_256_GCM
            </div>
        </div>
    </main>

    <!-- Footer Content -->
    <footer
        class="fixed bottom-0 w-full flex justify-between items-center px-8 py-4 opacity-50 z-20 pointer-events-none">
        <div class="font-mono text-[10px] uppercase tracking-widest text-cyan-900">
            © 2024 KINETIC PULSE SYSTEMS
        </div>
        <div class="flex gap-6 pointer-events-auto">
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Status</a>
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Privacy</a>
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Terminal</a>
        </div>
    </footer>

    <!-- Decorative Corner Accents -->
    <div class="fixed top-8 left-8 w-12 h-12 border-t border-l border-primary/20 pointer-events-none"></div>
    <div class="fixed top-8 right-8 w-12 h-12 border-t border-r border-primary/20 pointer-events-none"></div>
    <div class="fixed bottom-8 left-8 w-12 h-12 border-b border-l border-primary/20 pointer-events-none"></div>
    <div class="fixed bottom-8 right-8 w-12 h-12 border-b border-r border-primary/20 pointer-events-none"></div>

    <script>
            (function () {
                // DOM elements
                const form = document.getElementById('registerForm');
                const usernameInput = document.getElementById('username');
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const confirmInput = document.getElementById('confirmPassword');
                const errorDiv = document.getElementById('errorMessage');
                const errorSpan = document.getElementById('errorText');
                const successDiv = document.getElementById('successMessage');
                const successSpan = document.getElementById('successText');
                const registerBtn = document.getElementById('registerBtn');
                const btnLabel = document.getElementById('btnLabel');
                const strengthFill = document.querySelector('.strength-fill');
                const strengthLabel = document.getElementById('strengthLabel');
                const strengthText = document.getElementById('strengthText');
                const cardEl = document.querySelector('.glass-card');

                // Password strength evaluator
                function evaluatePasswordStrength(pwd) {
                    if (!pwd) return { score: 0, label: 'WEAK', text: '—', width: '0%' };
                    let score = 0;
                    if (pwd.length >= 6) score += 1;
                    if (pwd.length >= 10) score += 1;
                    if (/[A-Z]/.test(pwd)) score += 1;
                    if (/[0-9]/.test(pwd)) score += 1;
                    if (/[^A-Za-z0-9]/.test(pwd)) score += 1;
                    const percent = Math.min(100, (score / 5) * 100);
                    let label = '', text = '';
                    if (score <= 1) { label = 'WEAK'; text = 'INSECURE'; }
                    else if (score === 2) { label = 'FAIR'; text = 'LOW_SECURITY'; }
                    else if (score === 3) { label = 'MODERATE'; text = 'ACCEPTABLE'; }
                    else if (score === 4) { label = 'STRONG'; text = 'HIGH_SECURITY'; }
                    else { label = 'MAXIMUM'; text = 'OPTIMAL'; }
                    return { width: `${percent}%`, label, text, score };
                }

                function updateStrengthMeter() {
                    const pwd = passwordInput.value;
                    const { width, label, text } = evaluatePasswordStrength(pwd);
                    strengthFill.style.width = width;
                    strengthLabel.textContent = 'PASSWORD_STRENGTH:';
                    strengthText.textContent = label;
                    if (pwd === '') {
                        strengthFill.style.width = '0%';
                        strengthLabel.textContent = 'PASSWORD_STRENGTH';
                        strengthText.textContent = '—';
                    }
                    // Color based on strength
                    if (label === 'MAXIMUM' || label === 'STRONG') {
                        strengthFill.style.background = 'linear-gradient(90deg, #81ecff, #b9ffb8)';
                    } else if (label === 'MODERATE') {
                        strengthFill.style.background = 'linear-gradient(90deg, #d277ff, #81ecff)';
                    } else {
                        strengthFill.style.background = 'linear-gradient(90deg, #ff716c, #d277ff)';
                    }
                }

                passwordInput.addEventListener('input', updateStrengthMeter);

                // Helper: show error
                function showError(msg) {
                    errorSpan.innerHTML = msg;
                    errorDiv.classList.remove('hidden');
                    successDiv.classList.add('hidden');
                    cardEl.classList.add('shake-animation');
                    setTimeout(() => {
                        cardEl.classList.remove('shake-animation');
                    }, 400);
                    setTimeout(() => {
                        if (!errorDiv.classList.contains('hidden')) {
                            // keep visible
                        }
                    }, 5000);
                }

                function showSuccess(msg) {
                    successSpan.innerHTML = msg;
                    successDiv.classList.remove('hidden');
                    errorDiv.classList.add('hidden');
                }

                function clearMessages() {
                    errorDiv.classList.add('hidden');
                    successDiv.classList.add('hidden');
                }

                // Loading state
                function setLoading(loading) {
                    if (loading) {
                        registerBtn.disabled = true;
                        btnLabel.innerHTML = '<span class="spinner-sm"></span>PROCESSING_ENROLLMENT...';
                        registerBtn.style.opacity = '0.8';
                    } else {
                        registerBtn.disabled = false;
                        btnLabel.innerHTML = 'INITIALIZE_ENROLLMENT →';
                        registerBtn.style.opacity = '1';
                    }
                }

                // Frontend validation
                function validateForm() {
                    const username = usernameInput.value.trim();
                    const email = emailInput.value.trim();
                    const password = passwordInput.value;
                    const confirm = confirmInput.value;

                    if (!username || !email || !password || !confirm) {
                        showError('ALL_FIELDS_REQUIRED // Complete enrollment data');
                        return false;
                    }
                    if (username.length < 3 || username.length > 20) {
                        showError('USERNAME_LENGTH_ERROR // Must be 3-20 characters');
                        return false;
                    }
                    const usernameRegex = /^[a-zA-Z0-9_]+$/;
                    if (!usernameRegex.test(username)) {
                        showError('USERNAME_FORMAT_ERROR // Only letters, numbers, underscores');
                        return false;
                    }
                    const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                    if (!emailRegex.test(email)) {
                        showError('EMAIL_FORMAT_ERROR // Invalid email structure');
                        return false;
                    }
                    if (password.length < 6) {
                        showError('PASSWORD_LENGTH_ERROR // Minimum 6 characters required');
                        return false;
                    }
                    if (password !== confirm) {
                        showError('PASSWORD_MISMATCH // Security phrases do not match');
                        return false;
                    }
                    return true;
                }

                // Visual password match
                function checkPasswordMatchVisual() {
                    const pwd = passwordInput.value;
                    const confirm = confirmInput.value;
                    if (confirm !== '' && pwd !== confirm) {
                        confirmInput.style.borderBottomColor = '#ff716c';
                    } else if (confirm !== '' && pwd === confirm) {
                        confirmInput.style.borderBottomColor = '#b9ffb8';
                    } else {
                        confirmInput.style.borderBottomColor = '';
                    }
                }

                passwordInput.addEventListener('input', checkPasswordMatchVisual);
                confirmInput.addEventListener('input', checkPasswordMatchVisual);
                usernameInput.addEventListener('input', () => clearMessages());
                emailInput.addEventListener('input', () => clearMessages());

                // Form submission
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    clearMessages();

                    if (!validateForm()) return;

                    const username = usernameInput.value.trim();
                    const email = emailInput.value.trim();
                    const password = passwordInput.value;

                    setLoading(true);

                    try {
                        const response = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ username, email, password })
                        });

                        let data;
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            data = await response.json();
                        } else {
                            throw new Error('Invalid server response format');
                        }

                        if (response.ok && data.success) {
                            showSuccess('ENROLLMENT_SUCCESSFUL // Redirecting to authentication...');
                            cardEl.style.transform = 'scale(1.01)';
                            setTimeout(() => { cardEl.style.transform = ''; }, 200);
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 1800);
                        } else {
                            const errMsg = data.error || data.message || 'REGISTRATION_FAILED // Credentials may exist';
                            showError(errMsg);
                            setLoading(false);
                        }
                    } catch (error) {
                        console.error('Registration network error:', error);
                        let friendlyMsg = 'NETWORK_ERROR // Cannot reach KINETIC server';
                        if (error.message === 'Failed to fetch') {
                            friendlyMsg = 'CONNECTION_REFUSED // Ensure backend is operational';
                        }
                        showError(friendlyMsg);
                        setLoading(false);
                    } finally {
                        setTimeout(() => {
                            if (registerBtn.disabled === true && window.location.pathname !== '/login') {
                                setLoading(false);
                            }
                        }, 3000);
                    }
                });

                // Initial strength meter
                updateStrengthMeter();
            })();
    </script>
</body>

</html>
