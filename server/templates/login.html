<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>KINETIC_OS // AUTHENTICATION</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "outline-variant": "#46484d",
                        "inverse-primary": "#006976",
                        "surface": "#0c0e12",
                        "on-secondary-fixed-variant": "#800ab4",
                        "tertiary-fixed": "#64fd7d",
                        "on-tertiary": "#006723",
                        "inverse-surface": "#f9f9ff",
                        "primary": "#81ecff",
                        "surface-container-highest": "#23262c",
                        "error-container": "#9f0519",
                        "secondary-fixed-dim": "#e7afff",
                        "primary-fixed-dim": "#00d4ec",
                        "on-secondary": "#380052",
                        "secondary-fixed": "#eec2ff",
                        "inverse-on-surface": "#53555a",
                        "surface-container": "#171a1f",
                        "surface-tint": "#81ecff",
                        "on-error": "#490006",
                        "primary-fixed": "#00e3fd",
                        "secondary-container": "#7d01b1",
                        "error-dim": "#d7383b",
                        "on-tertiary-container": "#005d1f",
                        "background": "#0c0e12",
                        "tertiary-fixed-dim": "#54ee70",
                        "on-secondary-container": "#f3cfff",
                        "primary-dim": "#00d4ec",
                        "tertiary": "#b9ffb8",
                        "primary-container": "#00e3fd",
                        "on-error-container": "#ffa8a3",
                        "on-surface": "#f6f6fc",
                        "tertiary-container": "#64fd7d",
                        "surface-container-high": "#1d2025",
                        "surface-variant": "#23262c",
                        "on-tertiary-fixed": "#004816",
                        "on-primary-fixed-variant": "#005762",
                        "surface-container-low": "#111318",
                        "on-background": "#f6f6fc",
                        "error": "#ff716c",
                        "surface-bright": "#292c33",
                        "secondary": "#d277ff",
                        "on-primary-fixed": "#003840",
                        "surface-container-lowest": "#000000",
                        "on-primary": "#005762",
                        "secondary-dim": "#d277ff",
                        "on-tertiary-fixed-variant": "#006823",
                        "tertiary-dim": "#54ee70",
                        "on-secondary-fixed": "#56007c",
                        "surface-dim": "#0c0e12",
                        "outline": "#74757a",
                        "on-surface-variant": "#aaabb0",
                        "on-primary-container": "#004d57"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Space Grotesk"],
                        body: ["Inter"],
                        label: ["Inter"],
                        mono: ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #050505;
            overflow: hidden;
        }

        .kinetic-grid {
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .kinetic-orb {
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(12, 14, 18, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(129, 236, 255, 0.1);
            position: relative;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, rgba(129, 236, 255, 0.2) 0%, transparent 40%, transparent 60%, rgba(210, 119, 255, 0.2) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .shake-animation {
            animation: shake 0.4s ease;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:focus {
            transition: background-color 600000s 0s, color 600000s 0s;
        }
    </style>
</head>

<body class="font-body text-on-surface min-h-screen flex items-center justify-center relative">

    <!-- Background Elements -->
    <div class="fixed inset-0 kinetic-grid z-0"></div>
    <div class="fixed top-1/4 -left-20 w-96 h-96 rounded-full bg-primary kinetic-orb z-0"></div>
    <div class="fixed bottom-1/4 -right-20 w-[500px] h-[500px] rounded-full bg-secondary kinetic-orb z-0"></div>
    <div
        class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-surface-tint kinetic-orb opacity-[0.05] z-0">
    </div>

    <!-- Main Content Shell -->
    <main class="relative z-10 w-full max-w-md px-6">
        <!-- Authentication Card -->
        <div class="glass-card p-10 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <!-- Header Section -->
            <header class="mb-12 text-center">
                <h1 class="font-headline text-3xl font-bold tracking-tighter text-primary uppercase mb-2">
                    KINETIC_OS
                </h1>
                <div class="flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[10px] text-primary">terminal</span>
                    <p class="font-mono text-[10px] tracking-widest text-on-surface-variant uppercase">
                        AUTHENTICATION_REQUIRED
                    </p>
                </div>
            </header>

            <!-- Form Fields -->
            <form id="loginForm" class="space-y-8">
                <!-- Username / Identity Token -->
                <div class="relative group">
                    <label
                        class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase mb-2 ml-1">
                        IDENTITY_TOKEN
                    </label>
                    <div class="relative">
                        <input id="username" name="username"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 px-4 transition-all duration-300"
                            placeholder="ENTER_UID" type="text" autocomplete="username" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                </div>

                <!-- Password / Secure Phrase -->
                <div class="relative group">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <label class="block font-mono text-[10px] tracking-widest text-on-surface-variant uppercase">
                            SECURE_PHRASE
                        </label>
                        <span id="togglePassword"
                            class="material-symbols-outlined text-sm text-on-surface-variant cursor-pointer hover:text-primary transition-colors">visibility_off</span>
                    </div>
                    <div class="relative">
                        <input id="password" name="password"
                            class="w-full bg-surface-container-lowest/40 border-b border-outline-variant focus:border-primary focus:ring-0 text-on-surface placeholder:text-outline-variant font-mono text-sm py-4 px-4 transition-all duration-300"
                            placeholder="••••••••" type="password" autocomplete="current-password" />
                        <div
                            class="absolute bottom-0 left-0 w-0 h-[1px] bg-primary transition-all duration-500 group-focus-within:w-full shadow-[0_0_10px_rgba(129,236,255,0.5)]">
                        </div>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage"
                    class="hidden bg-error/10 border-l-4 border-error rounded-lg p-3 text-xs text-error-light font-mono">
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" id="loginBtn"
                        class="w-full py-5 px-6 font-headline font-bold text-on-primary bg-primary-container/20 border border-primary/40 hover:bg-primary hover:text-on-primary transition-all duration-300 active:scale-95 shadow-[0_0_15px_rgba(0,227,253,0.1)] hover:shadow-[0_0_30px_rgba(0,227,253,0.3)] tracking-widest">
                        <span id="btnText">INITIALIZE_SESSION</span>
                    </button>
                </div>
            </form>

            <!-- Footer Links -->
            <footer class="mt-12 space-y-6">
                <div class="flex flex-col items-center gap-4">
                    <a class="font-mono text-[10px] tracking-tighter text-on-surface-variant hover:text-primary transition-colors"
                        href="/register">
                        NEW_PILOT? <span class="text-primary border-b border-primary/20">ENROLL_HERE</span>
                    </a>
                </div>
                <div class="bg-surface-container-lowest/60 p-3 flex items-start gap-3 border-l-2 border-primary/30 cursor-pointer"
                    id="demoFillBtn">
                    <span class="material-symbols-outlined text-primary text-sm mt-0.5">info</span>
                    <div>
                        <p class="font-mono text-[9px] text-on-surface-variant leading-tight">
                            DEMO_CREDENTIALS:
                        </p>
                        <p class="font-mono text-[10px] text-on-surface tracking-widest mt-1">
                            ADMIN / ADMIN123
                        </p>
                    </div>
                </div>
            </footer>
        </div>

        <!-- System Metadata Decorations -->
        <div class="mt-8 flex justify-between items-center px-2 opacity-40">
            <div class="flex items-center gap-2 font-mono text-[8px] tracking-[0.2em]">
                <span class="w-1.5 h-1.5 bg-primary rounded-full animate-pulse"></span>
                CORE_STABLE_V4.2
            </div>
            <div class="font-mono text-[8px] tracking-[0.2em]">
                ENCRYPTION: AES_256_GCM
            </div>
        </div>
    </main>

    <!-- Footer Content -->
    <footer
        class="fixed bottom-0 w-full flex justify-between items-center px-8 py-4 opacity-50 z-20 pointer-events-none">
        <div class="font-mono text-[10px] uppercase tracking-widest text-cyan-900">
            © 2024 KINETIC PULSE SYSTEMS
        </div>
        <div class="flex gap-6 pointer-events-auto">
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Status</a>
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Privacy</a>
            <a class="font-mono text-[10px] uppercase tracking-widest text-slate-700 hover:text-cyan-500 transition-colors"
                href="#">Terminal</a>
        </div>
    </footer>

    <!-- Decorative Corner Accents -->
    <div class="fixed top-8 left-8 w-12 h-12 border-t border-l border-primary/20 pointer-events-none"></div>
    <div class="fixed top-8 right-8 w-12 h-12 border-t border-r border-primary/20 pointer-events-none"></div>
    <div class="fixed bottom-8 left-8 w-12 h-12 border-b border-l border-primary/20 pointer-events-none"></div>
    <div class="fixed bottom-8 right-8 w-12 h-12 border-b border-r border-primary/20 pointer-events-none"></div>

    <script>
            (function () {
                const form = document.getElementById('loginForm');
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const errorDiv = document.getElementById('errorMessage');
                const loginBtn = document.getElementById('loginBtn');
                const btnTextSpan = document.getElementById('btnText');
                const togglePassword = document.getElementById('togglePassword');
                const demoFillBtn = document.getElementById('demoFillBtn');
                const cardEl = document.querySelector('.glass-card');

                // Password visibility toggle
                let isPasswordVisible = false;
                togglePassword.addEventListener('click', () => {
                    isPasswordVisible = !isPasswordVisible;
                    passwordInput.type = isPasswordVisible ? 'text' : 'password';
                    togglePassword.textContent = isPasswordVisible ? 'visibility' : 'visibility_off';
                });

                // Helper to show error
                function showError(message) {
                    errorDiv.textContent = message;
                    errorDiv.classList.remove('hidden');
                    cardEl.classList.add('shake-animation');
                    setTimeout(() => {
                        cardEl.classList.remove('shake-animation');
                    }, 500);
                    setTimeout(() => {
                        if (errorDiv.classList.contains('hidden') === false) {
                            // Keep visible, but user can clear on next attempt
                        }
                    }, 5000);
                }

                function clearError() {
                    errorDiv.classList.add('hidden');
                    errorDiv.textContent = '';
                }

                // Set loading state
                function setLoading(isLoading) {
                    if (isLoading) {
                        loginBtn.disabled = true;
                        btnTextSpan.innerHTML = '<span class="loading-spinner"></span>AUTHENTICATING';
                        loginBtn.style.opacity = '0.8';
                    } else {
                        loginBtn.disabled = false;
                        btnTextSpan.innerText = 'INITIALIZE_SESSION';
                        loginBtn.style.opacity = '1';
                    }
                }

                // Add success visual feedback
                function addSuccessGlow() {
                    cardEl.style.transition = 'box-shadow 0.2s';
                    cardEl.style.boxShadow = '0 0 0 2px rgba(129, 236, 255, 0.5), 0 25px 45px rgba(0,0,0,0.3)';
                    setTimeout(() => {
                        cardEl.style.boxShadow = '';
                    }, 400);
                }

                // Demo credentials fill
                demoFillBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    usernameInput.value = 'admin';
                    passwordInput.value = 'admin123';
                    usernameInput.style.borderBottomColor = '#81ecff';
                    passwordInput.style.borderBottomColor = '#81ecff';
                    setTimeout(() => {
                        usernameInput.style.borderBottomColor = '';
                        passwordInput.style.borderBottomColor = '';
                    }, 800);
                });

                // Form submission
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    clearError();

                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    if (!username || !password) {
                        showError('Please fill in both IDENTITY_TOKEN and SECURE_PHRASE.');
                        return;
                    }

                    setLoading(true);

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ username, password })
                        });

                        let data;
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            data = await response.json();
                        } else {
                            throw new Error('Invalid server response');
                        }

                        if (response.ok && data.success) {
                            localStorage.setItem('token', data.data.token);
                            localStorage.setItem('user', JSON.stringify({
                                id: data.data.user_id,
                                username: data.data.username
                            }));
                            addSuccessGlow();
                            setTimeout(() => {
                                window.location.href = '/dashboard';
                            }, 200);
                        } else {
                            const errMsg = data.error || data.message || 'Authentication failed. Invalid credentials.';
                            showError(errMsg);
                            setLoading(false);
                        }
                    } catch (error) {
                        console.error('Login network error:', error);
                        let friendlyMsg = 'Network error. Could not connect to gesture server.';
                        if (error.message === 'Failed to fetch') {
                            friendlyMsg = '⚠️ Cannot reach server. Make sure backend is running.';
                        } else if (error.message.includes('JSON')) {
                            friendlyMsg = 'Server response error. Please try again.';
                        }
                        showError(friendlyMsg);
                        setLoading(false);
                    } finally {
                        setTimeout(() => {
                            if (loginBtn.disabled === true && window.location.pathname !== '/dashboard') {
                                setLoading(false);
                            }
                        }, 1500);
                    }
                });

                // Input focus effects
                const inputs = [usernameInput, passwordInput];
                inputs.forEach(input => {
                    input.addEventListener('focus', () => {
                        const parentGroup = input.closest('.relative.group');
                        if (parentGroup) {
                            parentGroup.style.transform = 'translateX(2px)';
                        }
                    });
                    input.addEventListener('blur', () => {
                        const parentGroup = input.closest('.relative.group');
                        if (parentGroup) {
                            parentGroup.style.transform = '';
                        }
                    });
                });
            })();
    </script>
</body>

</html>
