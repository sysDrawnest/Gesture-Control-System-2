<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | KINETIC PULSE</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#81ecff",
                        "secondary": "#d277ff",
                        "background": "#0c0e12",
                        "surface": "#171a1f",
                        "surface-variant": "#23262c",
                        "on-surface": "#f6f6fc",
                        "on-surface-variant": "#aaabb0",
                        "outline": "#46484d",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.body');
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(129, 236, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(210, 119, 255, 0.05) 0%, transparent 50%);
        }

        .glass-card {
            background: rgba(23, 26, 31, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(129, 236, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .neo-glow {
            box-shadow: 0 0 40px rgba(129, 236, 255, 0.1);
        }

        .animated-bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.2;
            animation: pulse-orb 15s infinite alternate ease-in-out;
        }

        @keyframes pulse-orb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(5%, 5%); }
        }

        .input-dark {
            @apply w-full bg-white/[0.03] border border-white/10 rounded-xl px-4 py-3 text-on-surface focus:border-primary/50 focus:bg-white/[0.05] transition-all outline-none placeholder:text-on-surface-variant/30;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Background Orbs -->
    <div class="animated-bg-orb w-[500px] h-[500px] bg-primary top-[-10%] left-[-10%]"></div>
    <div class="animated-bg-orb w-[400px] h-[400px] bg-secondary bottom-[-10%] right-[-10%]" style="animation-delay: -5s;"></div>

    <div class="w-full max-w-[440px] relative">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-2xl mx-auto flex items-center justify-center text-background mb-4 shadow-[0_0_20px_rgba(129,236,255,0.4)]">
                <span class="material-symbols-outlined text-3xl font-bold">gesture</span>
            </div>
            <h1 class="font-headline text-3xl font-bold tracking-tighter text-on-surface uppercase mb-1">
                Kinetic <span class="text-primary">Pulse</span>
            </h1>
            <p class="text-on-surface-variant text-sm font-medium tracking-wide">Touchless intelligence starts here.</p>
        </div>

        <!-- Auth Card -->
        <div class="glass-card p-10 rounded-[2.5rem] neo-glow">
            <h2 class="text-xl font-headline font-bold text-on-surface mb-8 text-center uppercase tracking-widest">Sign In</h2>
            
            <form id="loginForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Username</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">fingerprint</span>
                        <input type="text" id="username" required class="input-dark pl-12" placeholder="admin">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl">lock</span>
                        <input type="password" id="password" required class="input-dark pl-12" placeholder="••••••••">
                    </div>
                </div>

                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-[11px] font-medium py-3 px-4 rounded-xl text-center"></div>

                <button type="submit" id="loginBtn" class="w-full bg-primary text-background font-headline font-bold uppercase tracking-widest py-4 rounded-xl hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(129,236,255,0.2)]">
                    <span id="btnText">Log In</span>
                    <span class="material-symbols-outlined text-xl">arrow_right_alt</span>
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-on-surface-variant text-xs mb-1">Don't have an account?</p>
                <a href="/register" class="text-primary font-bold text-sm hover:underline">Create a Kinetic Profile</a>
            </div>
            
            <!-- Quick Fill Demo -->
            <div class="mt-6 flex justify-center">
                <button id="demoBtn" class="text-[10px] text-on-surface-variant/40 hover:text-primary transition-colors flex items-center gap-1.5 uppercase font-bold">
                    <i class="fas fa-magic"></i> Auto-fill Demo
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorDiv = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const demoBtn = document.getElementById('demoBtn');

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('hidden');
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            const username = usernameInput.value;
            const password = passwordInput.value;

            loginBtn.disabled = true;
            btnText.textContent = "Authenticating...";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.data.user_id,
                        username: data.data.username
                    }));
                    window.location.href = '/dashboard';
                } else {
                    showError(data.error || 'Invalid credentials');
                    loginBtn.disabled = false;
                    btnText.textContent = "Log In";
                }
            } catch (err) {
                showError('Server connection lost');
                loginBtn.disabled = false;
                btnText.textContent = "Log In";
            }
        });

        demoBtn.addEventListener('click', () => {
            usernameInput.value = 'admin';
            passwordInput.value = 'admin123';
            usernameInput.classList.add('border-primary/50');
            passwordInput.classList.add('border-primary/50');
            setTimeout(() => {
                usernameInput.classList.remove('border-primary/50');
                passwordInput.classList.remove('border-primary/50');
            }, 600);
        });
    </script>
</body>

</html>
