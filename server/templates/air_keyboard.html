<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Air Keyboard | KINETIC PULSE</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#81ecff",
                        "secondary": "#d277ff",
                        "background": "#0c0e12",
                        "surface": "#171a1f",
                        "surface-variant": "#23262c",
                        "on-surface": "#f6f6fc",
                        "on-surface-variant": "#aaabb0",
                        "outline": "#46484d",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.body');
        }

        .glass-card {
            background: rgba(23, 26, 31, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(129, 236, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .neo-glow {
            box-shadow: 0 0 20px rgba(129, 236, 255, 0.15);
        }

        .status-badge.connected {
            background: rgba(129, 236, 255, 0.1);
            color: theme('colors.primary');
            border: 1px solid rgba(129, 236, 255, 0.2);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .editor-area {
            font-family: 'Inter', monospace;
            line-height: 1.6;
            min-height: 400px;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: theme('colors.primary');
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px theme('colors.primary');
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .suggestion-pill {
            @apply flex-shrink-0 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-sm font-medium hover:bg-primary/10 hover:border-primary/30 hover:text-primary transition-all cursor-default;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(129, 236, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(129, 236, 255, 0.3);
        }
    </style>
</head>

<body class="min-h-screen overflow-x-hidden">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-card border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-background ml-2">
                    <span class="material-symbols-outlined font-bold text-sm">keyboard</span>
                </div>
                <h1 class="font-headline text-lg font-bold tracking-tighter text-on-surface uppercase">
                    Air <span class="text-primary">Keyboard</span>
                </h1>
            </div>
            
            <div id="connectionStatus" class="status-badge disconnected text-[10px] sm:text-xs">
                <i class="fas fa-circle text-[8px] mr-1.5"></i> DISCONNECTED
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <!-- Status Banner -->
        <div id="statusBanner" class="glass-card mb-6 py-3 px-6 rounded-xl border-l-4 border-outline text-sm text-on-surface-variant flex items-center gap-3 transition-all">
            <i class="fas fa-info-circle text-primary"></i>
            <span>System initialization... Run <code class="bg-white/5 px-2 py-0.5 rounded text-primary">python client/air_keyboard.py</code></span>
        </div>

        <!-- Main Editor Interface -->
        <div class="glass-card rounded-3xl p-6 sm:p-10 neo-glow overflow-hidden">
            <!-- Suggestions Bar -->
            <div id="suggestionsBar" class="flex gap-2 mb-8 overflow-x-auto pb-2 no-scrollbar min-h-[44px]">
                <!-- Suggestions will appear here -->
                <div class="text-xs text-on-surface-variant/40 italic py-2">Real-time word predictions will appear here...</div>
            </div>

            <!-- Editor Surface -->
            <div class="editor-area bg-white/[0.02] border border-white/5 rounded-2xl p-8 text-xl sm:text-2xl text-on-surface outline-none focus:border-primary/20 transition-all custom-scrollbar overflow-y-auto max-h-[500px]" id="editorArea">
                <span class="cursor"></span>
            </div>
        </div>

        <!-- Gesture Guide Bento -->
        <div class="mt-8 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center group hover:bg-white/5 transition-all">
                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">👍</span>
                <div class="text-[12px] font-bold text-primary">START</div>
                <div class="text-[10px] text-on-surface-variant">Thumb Up 2s</div>
            </div>
            <div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center group hover:bg-white/5 transition-all">
                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">✍️</span>
                <div class="text-[12px] font-bold text-primary">DRAW</div>
                <div class="text-[10px] text-on-surface-variant">Index Stroke</div>
            </div>
            <div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center group hover:bg-white/5 transition-all">
                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">🤙</span>
                <div class="text-[12px] font-bold text-secondary">SAVE</div>
                <div class="text-[10px] text-on-surface-variant">Shaka Sign 2s</div>
            </div>
            <div class="glass-card p-4 rounded-2xl flex flex-col items-center text-center group hover:bg-white/5 transition-all">
                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">✊</span>
                <div class="text-[12px] font-bold text-outline">EXIT</div>
                <div class="text-[10px] text-on-surface-variant">Hold Fist 2s</div>
            </div>
        </div>

        <!-- Swipe Commands -->
        <div class="mt-4 flex flex-wrap justify-center gap-6 py-4 px-6 glass-card rounded-2xl bg-white/[0.01]">
            <div class="flex items-center gap-2 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">
                <i class="fas fa-arrow-left text-primary"></i> Backspace (Swipe L)
            </div>
            <div class="flex items-center gap-2 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">
                <i class="fas fa-arrow-right text-primary"></i> Space (Swipe R)
            </div>
            <div class="flex items-center gap-2 text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">
                <i class="fas fa-arrow-down text-primary"></i> New Line (Swipe D)
            </div>
        </div>
    </main>

    <script>
        const socket = io();
        const statusBadge = document.getElementById('connectionStatus');
        const statusBanner = document.getElementById('statusBanner');
        const editorArea = document.getElementById('editorArea');
        const suggestionsBar = document.getElementById('suggestionsBar');

        function updateConnection(connected) {
            if (connected) {
                statusBadge.className = 'status-badge connected text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full flex items-center transition-all';
                statusBadge.innerHTML = '<i class="fas fa-circle text-[8px] mr-1.5 animate-pulse"></i> LIVE PULSE';
                statusBanner.className = 'glass-card mb-6 py-3 px-6 rounded-xl border-l-4 border-primary text-sm text-on-surface-variant flex items-center gap-3 transition-all bg-primary/5';
                statusBanner.innerHTML = '<i class="fas fa-satellite-dish text-primary"></i><span>Stream active. Ready for spatial input...</span>';
            } else {
                statusBadge.className = 'status-badge disconnected text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full flex items-center transition-all';
                statusBadge.innerHTML = '<i class="fas fa-circle text-[8px] mr-1.5"></i> OFFLINE';
                statusBanner.className = 'glass-card mb-6 py-3 px-6 rounded-xl border-l-4 border-outline text-sm text-on-surface-variant flex items-center gap-3 transition-all';
                statusBanner.innerHTML = '<i class="fas fa-exclamation-triangle text-on-surface-variant"></i><span>Connection interrupted. Auto-recovering...</span>';
            }
        }

        socket.on('connect', () => updateConnection(true));
        socket.on('disconnect', () => updateConnection(false));

        socket.on('keyboard_data', (data) => {
            // Update Status Msg with better visual feedback
            if (data.status_msg) {
                const isWriting = data.status_msg.includes('Active');
                statusBanner.innerHTML = `<i class="fas ${isWriting ? 'fa-pen-nib animate-bounce' : 'fa-info-circle'} text-primary"></i><span>${data.status_msg}</span>`;
                if (isWriting) {
                    statusBanner.classList.add('border-primary');
                    statusBanner.classList.add('bg-primary/5');
                } else {
                    statusBanner.classList.remove('border-primary');
                    statusBanner.classList.remove('bg-primary/5');
                }
            }

            // Update Text Editor
            if (data.text_lines) {
                let html = '';
                data.text_lines.forEach((line, index) => {
                    html += `<div>${line || '&nbsp;'}</div>`;
                });
                editorArea.innerHTML = html + '<span class="cursor"></span>';
                // Auto-scroll to bottom
                editorArea.scrollTop = editorArea.scrollHeight;
            }

            // Update Predictions/Suggestions
            if (data.suggestions && data.suggestions.length > 0) {
                suggestionsBar.innerHTML = '';
                data.suggestions.forEach(suggestion => {
                    const pill = document.createElement('div');
                    pill.className = 'suggestion-pill';
                    pill.textContent = suggestion;
                    suggestionsBar.appendChild(pill);
                });
            } else if (data.suggestions === null || data.suggestions === undefined) {
                // Keep last suggestions or clear if explicit
            }
        });
    </script>
</body>

</html>
